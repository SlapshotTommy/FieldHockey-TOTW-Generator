<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saintfield Hockey - Team of the Week</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header>
        <h1>SAINTFIELD HOCKEY CLUB</h1>
        <h2>TEAM OF THE WEEK GENERATOR</h2>
    </header>

    <main class="app">

        <!-- =========================
             CONTROLS
        ========================== -->

        <section class="controls">

            <div class="section-title">
                Team Details
            </div>

            <div class="team-details">

                <label>
                    Season
                    <input
                        id="season"
                        type="text"
                        value="2026/27">
                </label>

                <label>
                    Weekend
                    <input
                        id="weekend"
                        type="text"
                        value="Weekend 3">
                </label>

            </div>


            <div class="section-title">
                Starting XI
            </div>

            <p class="hint">
                Enter each player's name, squad and performance summary.
                Separate individual reasons using |
            </p>


            <!-- Player inputs are generated by JavaScript -->

            <div id="players"></div>


            <button
                id="generateButton"
                type="button">
                Generate TOTW
            </button>

        </section>


        <!-- =========================
             PREVIEW
        ========================== -->

        <section class="preview">

            <div class="section-title">
                Preview
            </div>

            <div class="canvas-wrapper">

                <canvas
                    id="totwCanvas"
                    width="1080"
                    height="1350">
                </canvas>

            </div>

        </section>

    </main>


    <script src="./js/totw.js"></script>

</body>

</html>
